# www → bare domain redirect
server {
    listen 80;
    server_name www.image-space.app;
    return 301 https://image-space.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.image-space.app;

    ssl_certificate /etc/nginx/ssl/origin_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert_key.pem;

    return 301 https://image-space.app$request_uri;
}

# api → bare domain redirect
server {
    listen 80;
    server_name api.image-space.app;
    return 301 https://image-space.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.image-space.app;

    ssl_certificate /etc/nginx/ssl/origin_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert_key.pem;

    return 301 https://image-space.app$request_uri;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name image-space.app admin.image-space.app;
    return 301 https://$server_name$request_uri;
}

# HTTPS main
server {
    listen 443 ssl;
    http2 on;
    server_name image-space.app admin.image-space.app;

    ssl_certificate /etc/nginx/ssl/origin_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow only Cloudflare IPs
    include /etc/nginx/cloudflare-ips.conf;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://minio:9000/' '/minio/';
        sub_filter 'minio:9000/' '/minio/';
    }

    location = /doc.html {
        proxy_pass http://backend:8088/doc.html;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8088/v3/api-docs/;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8088/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://backend:8088/webjars/;
        proxy_set_header Host $host;
    }

    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
    }

    location /minio-console/{
        proxy_pass http://minio:9001/;
        proxy_set_header Host minio:9001;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
