<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><defs><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#314056" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="arrowRed" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#b42318" d="M2,2 L10,6 L2,10 Z"/></marker><style>.bg{fill:#f7f9fc}.title{font:700 38px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#111827}.subtitle{font:400 18px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#586174}.lane-title{font:700 22px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#243044}.box-title{font:700 20px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#111827}.box-text{font:400 16px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#334155}.small{font:400 14px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#526071}.tiny{font:400 13px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#667085}.bad,.ok{font-weight:700}.ok{fill:#05603a}.bad{fill:#b42318}.lane{fill:#fff;stroke:#d9e2f1;stroke-width:2;rx:24}.edge,.frontend{stroke-width:2;rx:18}.frontend{fill:#ecfdf3;stroke:#86cb9c}.edge{fill:#eff6ff;stroke:#78a8f5}.backend{fill:#fff7ed;stroke:#f3a96a}.backend,.cache,.risk,.store{stroke-width:2;rx:18}.store{fill:#f5f3ff;stroke:#a78bfa}.risk{fill:#fff1f2;stroke:#fb7185}.cache{fill:#f0fdfa;stroke:#2dd4bf}.flow,.flow-dashed{fill:none;stroke:#314056;stroke-width:2.4;marker-end:url(#arrow)}.flow-dashed{stroke-width:2.2;stroke-dasharray:8 8}.flow-red{fill:none;stroke:#b42318;stroke-width:2.4;marker-end:url(#arrowRed)}.section-label{font:700 18px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#1d2939}.pill{fill:#fff;stroke:#cfd8e6;stroke-width:1.5;rx:18}.pill-text{font:700 15px &quot;Microsoft YaHei&quot;,&quot;SimHei&quot;,Arial,sans-serif;fill:#344054}</style></defs><rect width="1800" height="1250" x="0" y="0" class="bg"/><text x="64" y="62" class="title">图片访问架构：权限变化与缓存策略</text><text x="64" y="96" class="subtitle">主图库 images/*：公开图走 Worker 校验后可缓存，私有图必须鉴权且不缓存，权限变化时清理 Redis、短 token 和 Cloudflare 缓存。</text><rect width="410" height="660" x="42" y="135" class="lane"/><text x="72" y="178" class="lane-title">浏览器与前端</text><rect width="470" height="660" x="488" y="135" class="lane"/><text x="520" y="178" class="lane-title">Cloudflare 边缘层</text><rect width="360" height="660" x="994" y="135" class="lane"/><text x="1024" y="178" class="lane-title">后端服务</text><rect width="365" height="660" x="1390" y="135" class="lane"/><text x="1420" y="178" class="lane-title">数据与对象存储</text><rect width="320" height="128" x="75" y="220" class="frontend"/><text x="102" y="256" class="box-title">用户浏览器</text><text x="102" y="288" class="box-text">页面加载 Vue 前端</text><text x="102" y="316" class="box-text">图片地址来自后端返回字段</text><rect width="320" height="174" x="75" y="410" class="frontend"/><text x="102" y="446" class="box-title">Vue 组件</text><text x="102" y="478" class="box-text">ImageCard / ImageDetail</text><text x="102" y="508" class="box-text">优先使用 publicUrl / privateUrl</text><text x="102" y="538" class="box-text">兼容 imageUrl</text><text x="102" y="562" class="small">仅加载失败才 fallback 到下载接口</text><rect width="320" height="96" x="75" y="640" class="backend"/><text x="102" y="676" class="box-title">业务 API</text><text x="102" y="708" class="box-text">/api/image/list / detail / update</text><rect width="370" height="110" x="530" y="214" class="edge"/><text x="558" y="250" class="box-title">CDN 主机名</text><text x="558" y="282" class="box-text">cdn.image-space.app/* 全量进 Worker</text><text x="558" y="306" class="small">旧根路径 /images/* 直接 404</text><rect width="370" height="158" x="530" y="368" class="edge"/><text x="558" y="404" class="box-title">Worker 严格路由</text><text x="558" y="436" class="box-text">/public/{storageKey}</text><text x="558" y="466" class="box-text">/private/{storageKey}</text><text x="558" y="496" class="small">storageKey 必须是 images/*</text><rect width="370" height="144" x="530" y="590" class="cache"/><text x="558" y="626" class="box-title">Worker Cache</text><text x="558" y="658" class="box-text">只缓存公开图完整 URL</text><text x="558" y="688" class="box-text">HIT 时不查 Redis / 后端 / R2</text><text x="558" y="716" class="small">key 包含 ?v=mediaVersion</text><rect width="292" height="148" x="1026" y="220" class="backend"/><text x="1052" y="256" class="box-title">ImageReadService</text><text x="1052" y="288" class="box-text">生成 ImageVO</text><text x="1052" y="318" class="box-text">publicUrl / privateUrl</text><text x="1052" y="344" class="small">imageUrl 保持兼容</text><rect width="292" height="154" x="1026" y="426" class="backend"/><text x="1052" y="462" class="box-title">内部媒体接口</text><text x="1052" y="494" class="box-text">/api/internal/media/meta</text><text x="1052" y="524" class="box-text">/api/internal/media/authorize</text><text x="1052" y="552" class="small">必须带 X-Internal-Token</text><rect width="292" height="96" x="1026" y="642" class="backend"/><text x="1052" y="678" class="box-title">ImageWriteService</text><text x="1052" y="710" class="box-text">处理 visibility 变化副作用</text><rect width="288" height="122" x="1422" y="204" class="store"/><text x="1450" y="240" class="box-title">MySQL images</text><text x="1450" y="272" class="box-text">visibility / ownerId</text><text x="1450" y="302" class="box-text">storageKey / media_version</text><rect width="288" height="150" x="1422" y="386" class="store"/><text x="1450" y="422" class="box-title">Upstash Redis</text><text x="1450" y="454" class="box-text">media:meta:{storageKey}</text><text x="1450" y="484" class="box-text">TTL 默认 300 秒</text><text x="1450" y="512" class="small">Worker miss 时再查后端</text><rect width="288" height="148" x="1422" y="594" class="store"/><text x="1450" y="630" class="box-title">R2 私有桶</text><text x="1450" y="662" class="box-text">真实对象：images/*</text><text x="1450" y="692" class="box-text">不允许直连 public bucket</text><text x="1450" y="720" class="small">由 Worker 读取并返回</text><path d="M395 284 C455 284 468 268 530 268" class="flow"/><text x="418" y="256" class="small">请求页面</text><path d="M395 496 C455 496 468 448 530 448" class="flow"/><text x="418" y="432" class="small">图片 URL</text><path d="M900 445 C958 445 970 494 1026 494" class="flow"/><text x="900" y="424" class="small">MISS 或私有鉴权</text><path d="M1318 494 C1370 494 1378 462 1422 462" class="flow"/><text x="1340" y="444" class="small">读/写 meta</text><path d="M1318 292 C1370 292 1378 266 1422 266" class="flow"/><text x="1332" y="250" class="small">查询图片记录</text><path d="M900 668 C1120 668 1210 668 1422 668" class="flow"/><text x="976" y="646" class="small">校验通过后读取对象</text><path d="M1422 704 C1160 780 790 792 395 520" class="flow"/><text x="890" y="768" class="small">返回图片响应</text><path d="M715 526 C715 548 715 568 715 590" class="flow-dashed"/><text x="733" y="560" class="tiny">public 先查缓存</text><path d="M715 590 C705 552 704 520 715 526" class="flow-dashed"/><text x="552" y="566" class="tiny">HIT 直接返回</text><path d="M900 270 C940 250 980 242 1026 248" class="flow-red"/><text x="916" y="238" class="small bad">旧 /images/* 拒绝</text><rect width="255" height="38" x="100" y="764" class="pill"/><text x="125" y="789" class="pill-text">公开：可 CDN 缓存</text><rect width="310" height="38" x="565" y="764" class="pill"/><text x="590" y="789" class="pill-text">私有：必须鉴权，不缓存</text><rect width="270" height="38" x="1038" y="764" class="pill"/><text x="1062" y="789" class="pill-text">内部接口：Worker 专用</text><rect width="248" height="38" x="1442" y="764" class="pill"/><text x="1466" y="789" class="pill-text">R2：无公共直连</text><rect width="1713" height="335" x="42" y="845" class="lane"/><text x="72" y="888" class="lane-title">权限变化链路与缓存失效</text><rect width="300" height="176" x="84" y="930" class="risk"/><text x="112" y="966" class="box-title">公开 转 私有 / 指定用户</text><text x="112" y="1000" class="box-text">1. 更新 MySQL visibility</text><text x="112" y="1030" class="box-text">2. 删除 media:meta:{storageKey}</text><text x="112" y="1060" class="box-text">3. 删除 private token 索引</text><text x="112" y="1084" class="box-text">4. 精确 purge 旧 publicUrl</text><rect width="300" height="176" x="438" y="930" class="risk"/><text x="466" y="966" class="box-title">旧公开 URL</text><text x="466" y="1000" class="box-text">路径保持原样访问</text><text x="466" y="1030" class="box-text">/public/images/*?v=old</text><text x="466" y="1062" class="box-text bad">返回 404 + no-store</text><rect width="300" height="176" x="792" y="930" class="backend"/><text x="820" y="966" class="box-title">私有 转 公开</text><text x="820" y="1000" class="box-text">1. 更新 visibility=PUBLIC</text><text x="820" y="1030" class="box-text">2. media_version + 1</text><text x="820" y="1060" class="box-text">3. 删除 meta 与 token</text><text x="820" y="1084" class="box-text">4. 返回新的 publicUrl</text><rect width="300" height="176" x="1146" y="930" class="cache"/><text x="1174" y="966" class="box-title">新公开 URL</text><text x="1174" y="1000" class="box-text">/public/images/*?v=new</text><text x="1174" y="1032" class="box-text ok">200 + immutable</text><text x="1174" y="1064" class="box-text">后续命中 Worker Cache</text><rect width="210" height="176" x="1500" y="930" class="store"/><text x="1526" y="966" class="box-title">验证点</text><text x="1526" y="1000" class="box-text">旧 URL：404</text><text x="1526" y="1030" class="box-text">私有无 token：403</text><text x="1526" y="1060" class="box-text">新 URL：200</text><text x="1526" y="1090" class="box-text">缓存头正确</text><path d="M384 1010 C402 1010 420 1010 438 1010" class="flow-red"/><path d="M738 1010 C758 1010 772 1010 792 1010" class="flow"/><path d="M1092 1010 C1112 1010 1126 1010 1146 1010" class="flow"/><path d="M1446 1010 C1466 1010 1480 1010 1500 1010" class="flow"/><text x="84" y="1142" class="section-label">缓存策略总结：</text><text x="218" y="1142" class="box-text">公开图响应写入 Worker Cache，Cache-Control 为 public, max-age=31536000, immutable；私有图和错误响应均为 no-store。</text><text x="84" y="1172" class="section-label">安全边界：</text><text x="188" y="1172" class="box-text">旧公开 URL 不拼 token、不签名；权限变私有后必须 404；R2 不再通过公共 bucket/custom domain 直连。</text></svg>