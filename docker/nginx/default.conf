server {
    listen 80;
    server_name image-space.app www.image-space.app;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;
    set $backend_upstream backend:8088;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://$backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
    }

    location = /doc.html {
        proxy_pass http://$backend_upstream/doc.html;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://$backend_upstream/v3/api-docs/;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://$backend_upstream/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://$backend_upstream/webjars/;
        proxy_set_header Host $host;
    }

    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
    }

    location /minio-console/{
        proxy_pass http://minio:9001/;
        proxy_set_header Host minio:9001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
