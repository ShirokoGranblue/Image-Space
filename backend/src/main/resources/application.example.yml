server:
  port: 8088

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/picture_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html

app:
  upload-path: ./upload
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8088}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  webhook-path: ${APP_WEBHOOK_PATH:/api/webhook}

storage:
  type: r2
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket-name: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL:https://cdn.image-space.app}
  local:
    base-path: ./storage

media:
  internal:
    token: ${BACKEND_INTERNAL_TOKEN:}
  meta-cache:
    upstash-url: ${UPSTASH_REDIS_REST_URL:}
    upstash-token: ${UPSTASH_REDIS_REST_TOKEN:}

cloudflare:
  zone-id: ${CLOUDFLARE_ZONE_ID:}
  api-token: ${CLOUDFLARE_API_TOKEN:}
  purge-url: ${CLOUDFLARE_PURGE_URL:https://api.cloudflare.com/client/v4/zones/%s/purge_cache}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: ${GITHUB_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  timeout: 30000
  proxy:
    enabled: true
    host: '127.0.0.1'
    port: 7897
