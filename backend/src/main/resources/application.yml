server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/picture_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html

# app.upload-path 已移除 — 所有图片以 Base64 Data URL 存储在 MySQL 中
# 此配置仅在首次启动时用于数据迁移（读取旧文件），迁移完成后不再使用
app:
  upload-path: ./upload
