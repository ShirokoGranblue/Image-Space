server:
  port: 8088

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/picture_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:2653740949@qq.com}
    password: ${MAIL_PASSWORD:wilqwpuqbwtqeabe}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html

app:
  upload-path: ./upload

storage:
  type: minio
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
  local:
    base-path: ./storage

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:Ov23liFeDfmlOaFtqMcM}
    client-secret: ${GITHUB_CLIENT_SECRET:679bd506ebf94e226c7d62db5affd555ac1423ef}
    redirect-uri: 'http://localhost:8088/user/oauth/github/callback'
  google:
    client-id: ${GOOGLE_CLIENT_ID:857850390803-scf91lfied49isc59u8qlb2fu6ph86eo.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET: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}
    redirect-uri: 'http://localhost:8088/user/oauth/google/callback'
  timeout: 30000
  proxy:
    enabled: true
    host: '127.0.0.1'
    port: 7897

