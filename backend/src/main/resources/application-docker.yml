server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/picture_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@qq.com}
    password: ${MAIL_PASSWORD:your_smtp_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

storage:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket-name: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL:https://cdn.image-space.app}

media:
  internal:
    token: ${BACKEND_INTERNAL_TOKEN:}
  meta-cache:
    upstash-url: ${UPSTASH_REDIS_REST_URL:}
    upstash-token: ${UPSTASH_REDIS_REST_TOKEN:}

cloudflare:
  zone-id: ${CLOUDFLARE_ZONE_ID:}
  api-token: ${CLOUDFLARE_API_TOKEN:}
  purge-url: ${CLOUDFLARE_PURGE_URL:https://api.cloudflare.com/client/v4/zones/%s/purge_cache}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://image-space.app}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:https://image-space.app}
  webhook-path: ${APP_WEBHOOK_PATH:/api/webhook}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    tencent-ses:
      secret-id: ${TENCENT_SES_SECRET_ID:}
      secret-key: ${TENCENT_SES_SECRET_KEY:}
      region: ${TENCENT_SES_REGION:}
      from-address: ${TENCENT_SES_FROM_ADDRESS:}
      subject: ${TENCENT_SES_SUBJECT:AstralSpace 验证码}
      template-id: ${TENCENT_SES_TEMPLATE_ID:}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
    client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:https://image-space.app/api/user/oauth/github/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://image-space.app/api/user/oauth/google/callback}
  microsoft:
    client-id: ${MICROSOFT_CLIENT_ID}
    client-secret: ${MICROSOFT_CLIENT_SECRET}
    redirect-uri: ${MICROSOFT_REDIRECT_URI:https://image-space.app/api/user/oauth/microsoft/callback}
    tenant: common
    scope: openid profile email User.Read
    frontend-success-url: ${FRONTEND_MICROSOFT_LOGIN_SUCCESS_URL:}
    frontend-failure-url: ${FRONTEND_MICROSOFT_LOGIN_FAILURE_URL:}
    authorize-url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token-url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    user-info-url: https://graph.microsoft.com/v1.0/me
  proxy:
    enabled: false

turnstile:
  enabled: ${TURNSTILE_ENABLED:false}
  secret-key: ${TURNSTILE_SECRET_KEY:}
  siteverify-url: ${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  is-log: false
