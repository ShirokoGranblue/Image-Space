server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/picture_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
  data:
    redis:
      host: redis
      port: 6379
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@qq.com}
    password: ${MAIL_PASSWORD:your_smtp_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

storage:
  minio:
    endpoint: http://minio:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://4.230.10.11}
  webhook-path: ${APP_WEBHOOK_PATH:/api/webhook}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
    client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://4.230.10.11/api/user/oauth/github/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://4.230.10.11/api/user/oauth/google/callback}
  proxy:
    enabled: false
